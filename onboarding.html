<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarberFlow Elite - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#e5e2e1",
                    "surface-container-low": "#1c1b1b",
                    "surface-bright": "#393939",
                    "on-tertiary-fixed": "#1b1b1c",
                    "secondary": "#ffb3ad",
                    "primary-fixed": "#ffe088",
                    "surface-tint": "#e9c349",
                    "surface-dim": "#131313",
                    "on-background": "#e5e2e1",
                    "error": "#ffb4ab",
                    "tertiary": "#d0cdcd",
                    "on-surface-variant": "#d0c5af",
                    "on-surface": "#e5e2e1",
                    "on-secondary-fixed": "#3d0506",
                    "on-primary-fixed": "#241a00",
                    "inverse-on-surface": "#313030",
                    "on-primary": "#3c2f00",
                    "primary-container": "#d4af37",
                    "tertiary-container": "#b4b2b2",
                    "surface-container-high": "#2a2a2a",
                    "outline": "#99907c",
                    "primary": "#f2ca50",
                    "primary-fixed-dim": "#e9c349",
                    "secondary-container": "#7a322f",
                    "on-secondary-fixed-variant": "#77302d",
                    "secondary-fixed": "#ffdad7",
                    "on-secondary": "#5a1a19",
                    "inverse-primary": "#735c00",
                    "surface-container-lowest": "#0e0e0e",
                    "on-error-container": "#ffdad6",
                    "background": "#131313",
                    "surface-container-highest": "#353534",
                    "on-error": "#690005",
                    "inverse-surface": "#e5e2e1",
                    "surface-variant": "#353534",
                    "on-tertiary": "#303030",
                    "tertiary-fixed-dim": "#c8c6c5",
                    "outline-variant": "#4d4635",
                    "surface": "#131313",
                    "on-primary-fixed-variant": "#574500",
                    "secondary-fixed-dim": "#ffb3ad",
                    "on-tertiary-fixed-variant": "#474746",
                    "surface-container": "#201f1f",
                    "on-secondary-container": "#ff9e97",
                    "error-container": "#93000a",
                    "on-primary-container": "#554300",
                    "on-tertiary-container": "#454544"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "40px",
                    "xl": "64px",
                    "md": "24px",
                    "margin-desktop": "48px",
                    "base": "8px",
                    "margin-mobile": "16px",
                    "sm": "12px",
                    "gutter": "24px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Playfair Display"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Playfair Display"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Playfair Display"],
                    "headline-xl": ["Playfair Display"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .splash-fade-out {
            animation: fadeOut 0.8s forwards ease-in-out;
            animation-delay: 2.5s;
        }
        .onboarding-fade-in {
            opacity: 0;
            animation: fadeIn 1s forwards ease-out;
            animation-delay: 3s;
        }
        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cinematic-overlay {
            background: linear-gradient(to bottom, rgba(19, 19, 19, 0.4) 0%, rgba(19, 19, 19, 0.85) 60%, rgba(19, 19, 19, 1) 100%);
        }
        .loading-bar-fill {
            animation: progress 2.5s linear infinite;
        }
        @keyframes progress {
            0% { width: 0%; left: 0; }
            50% { width: 40%; left: 30%; }
            100% { width: 0%; left: 100%; }
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased overflow-hidden">
<!-- Splash Screen Layer -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background splash-fade-out" id="splash-screen">
<div class="text-center">
<h1 class="font-headline-xl text-headline-xl text-primary mb-2 tracking-tighter">
                BarberFlow
            </h1>
<p class="font-label-md text-label-md text-outline tracking-[0.3em] uppercase opacity-70">
                Elite Grooming
            </p>
<div class="mt-xl relative w-48 h-[2px] bg-surface-container-highest mx-auto rounded-full overflow-hidden">
<div class="loading-bar-fill absolute h-full bg-primary rounded-full"></div>
</div>
</div>
</div>
<!-- Main Onboarding Content -->
<main class="relative h-screen w-full flex flex-col justify-end onboarding-fade-in">
<!-- Cinematic Background Image -->
<div class="absolute inset-0 z-0">
<img alt="Elite Barbershop Interior" class="w-full h-full object-cover filter grayscale-[20%] brightness-[40%]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5Z0rASkwozJoki4GqmBrC1t5ly7eJmPovqE3ZKfsAkeOdbHm5koSG1KbqURRgZ2E1FbYDQ-7a-LnIRm7gb4f45eoyrEz1bbz4BYiHyz1eBJi_XLvc3aPTJ1Q-yzCjIdONGB68Cdok_SBHqdLEowcWUSwi5S9W16L5HA-Onw8qe344jfvIKxhUr6F1TCTC2Fd80TDZvVprnw3kXenXDjSPZpDCDGR0NxS9G_0qs8ot3-eHWXr-MPhZ2EODkqac7Msc9Z7BF0wxP2ON"/>
<div class="absolute inset-0 cinematic-overlay"></div>
</div>
<!-- Onboarding Interface -->
<section class="relative z-10 w-full max-w-xl mx-auto px-margin-mobile md:px-margin-desktop pb-xl flex flex-col items-center text-center">
<!-- Branding Accent -->
<div class="mb-md">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    content_cut
                </span>
</div>
<!-- Copywriting -->
<div class="space-y-base mb-xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background leading-tight">
                    Barbearia de Elite <br/>no seu Bolso
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                    Agende com os melhores profissionais e acompanhe sua vez em tempo real.
                </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-md mb-xl">
<button onclick="window.location.href='register.html'" class="w-full py-4 bg-primary text-on-primary font-bold rounded-lg transition-all active:scale-95 hover:bg-primary-container focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
                    Criar Conta
                </button>
<button onclick="window.location.href='login.html'" class="w-full py-4 border border-primary text-primary font-bold rounded-lg transition-all active:scale-95 hover:bg-primary/10 focus:ring-2 focus:ring-primary/50">
                    Entrar
                </button>
</div>
<!-- Subtle Loading / Indicator -->
<div class="flex flex-col items-center space-y-xs opacity-40">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Sincronizando com Elite Cloud
                </p>
<div class="flex space-x-1">
<div class="w-1 h-1 bg-primary rounded-full animate-pulse"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse [animation-delay:0.2s]"></div>
<div class="w-1 h-1 bg-primary rounded-full animate-pulse [animation-delay:0.4s]"></div>
</div>
</div>
</section>
<!-- Aesthetic Border Accents -->
<div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-primary/20 via-transparent to-transparent"></div>
<div class="absolute top-0 right-0 w-1 h-full bg-gradient-to-b from-primary/20 via-transparent to-transparent"></div>
</main>
<script>
        // Micro-interaction for splash transition
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.style.display = 'none';
                document.body.classList.remove('overflow-hidden');
            }, 3500);
        });

        // Add haptic-like feel to buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
</body></html>
