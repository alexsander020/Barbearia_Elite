<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BarberFlow Elite | Cadastrar-se</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glow-gold {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#e5e2e1",
                        "surface-container-low": "#1c1b1b",
                        "surface-bright": "#393939",
                        "on-tertiary-fixed": "#1b1b1c",
                        "secondary": "#ffb3ad",
                        "primary-fixed": "#ffe088",
                        "surface-tint": "#e9c349",
                        "surface-dim": "#131313",
                        "on-background": "#e5e2e1",
                        "error": "#ffb4ab",
                        "tertiary": "#d0cdcd",
                        "on-surface-variant": "#d0c5af",
                        "on-surface": "#e5e2e1",
                        "on-secondary-fixed": "#3d0506",
                        "on-primary-fixed": "#241a00",
                        "inverse-on-surface": "#313030",
                        "on-primary": "#3c2f00",
                        "primary-container": "#d4af37",
                        "tertiary-container": "#b4b2b2",
                        "surface-container-high": "#2a2a2a",
                        "outline": "#99907c",
                        "primary": "#f2ca50",
                        "primary-fixed-dim": "#e9c349",
                        "secondary-container": "#7a322f",
                        "on-secondary-fixed-variant": "#77302d",
                        "secondary-fixed": "#ffdad7",
                        "on-secondary": "#5a1a19",
                        "inverse-primary": "#735c00",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error-container": "#ffdad6",
                        "background": "#131313",
                        "surface-container-highest": "#353534",
                        "on-error": "#690005",
                        "inverse-surface": "#e5e2e1",
                        "surface-variant": "#353534",
                        "on-tertiary": "#303030",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#4d4635",
                        "surface": "#131313",
                        "on-primary-fixed-variant": "#574500",
                        "secondary-fixed-dim": "#ffb3ad",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-container": "#201f1f",
                        "on-secondary-container": "#ff9e97",
                        "error-container": "#93000a",
                        "on-primary-container": "#554300",
                        "on-tertiary-container": "#454544"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "40px",
                        "xl": "64px",
                        "md": "24px",
                        "margin-desktop": "48px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "sm": "12px",
                        "gutter": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Playfair Display"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Playfair Display"],
                        "headline-xl": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary/30 min-h-screen flex flex-col justify-between">
<!-- Header -->
<header class="border-b border-outline-variant py-4 px-margin-mobile md:px-margin-desktop bg-surface">
    <div class="max-w-7xl mx-auto flex justify-between items-center w-full">
        <a href="onboarding.html" class="font-headline-md text-headline-md font-bold text-primary tracking-tight">BarberFlow Elite</a>
        <a href="onboarding.html" class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors text-sm">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span> Voltar
        </a>
    </div>
</header>

<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
    <div class="bg-surface-container-high rounded-xl p-lg border border-outline-variant glow-gold w-full max-w-md">
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-primary text-[40px] mb-2" style="font-variation-settings: 'FILL' 1;">person_add</span>
            <h1 class="font-headline-lg text-headline-lg text-primary font-bold">Crie sua Conta</h1>
            <p class="text-on-surface-variant font-body-md mt-1">Junte-se à experiência premium de cuidado pessoal</p>
        </div>

        <form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='home.html';">
            <div>
                <label for="name" class="block font-label-md text-on-surface mb-2">Nome Completo</label>
                <div class="relative">
                    <input id="name" required class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary transition-colors" placeholder="Seu nome completo" type="text"/>
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">person</span>
                </div>
            </div>

            <div>
                <label for="email" class="block font-label-md text-on-surface mb-2">E-mail</label>
                <div class="relative">
                    <input id="email" required class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary transition-colors" placeholder="seu@email.com" type="email"/>
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">mail</span>
                </div>
            </div>

            <div>
                <label for="phone" class="block font-label-md text-on-surface mb-2">Celular</label>
                <div class="relative">
                    <input id="phone" required class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary transition-colors" placeholder="(11) 99999-9999" type="tel"/>
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">phone_iphone</span>
                </div>
            </div>

            <div>
                <label for="password" class="block font-label-md text-on-surface mb-2">Senha</label>
                <div class="relative">
                    <input id="password" required class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary transition-colors" placeholder="Crie uma senha forte" type="password"/>
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">key</span>
                </div>
            </div>

            <div class="flex items-start">
                <input id="terms" required class="rounded bg-surface-container-lowest border-outline-variant text-primary focus:ring-primary h-4 w-4 mt-1" type="checkbox"/>
                <label for="terms" class="ml-2 block text-sm text-on-surface-variant">Eu aceito os <a href="#" class="text-primary hover:underline font-semibold">Termos de Serviço</a> e a <a href="#" class="text-primary hover:underline font-semibold">Política de Privacidade</a>.</label>
            </div>

            <button type="submit" class="w-full bg-primary text-surface-container-lowest font-bold py-4 rounded-lg hover:bg-primary-container transition-all flex items-center justify-center gap-2 uppercase tracking-widest text-[12px] shadow-lg shadow-primary/20">
                Criar Conta
            </button>
        </form>

        <p class="text-center text-sm text-on-surface-variant mt-6">
            Já tem uma conta? <a href="login.html" class="text-primary font-bold hover:underline">Entre aqui</a>
        </p>
    </div>
</main>

<footer class="bg-surface-container-lowest border-t border-outline-variant py-6">
    <div class="text-center text-xs text-on-surface-variant px-margin-mobile">
        © 2024 BarberFlow Elite. Todos os direitos reservados.
    </div>
</footer>

<script>
    document.querySelectorAll('button').forEach(el => {
        el.addEventListener('mousedown', () => el.classList.add('scale-95', 'opacity-80'));
        el.addEventListener('mouseup', () => el.classList.remove('scale-95', 'opacity-80'));
        el.addEventListener('mouseleave', () => el.classList.remove('scale-95', 'opacity-80'));
    });
</script>
</body>
</html>
